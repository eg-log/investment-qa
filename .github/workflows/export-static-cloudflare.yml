
name: Prepare Cloudflare free static inference

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout models
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --only-binary=:all: "numpy==2.2.6" "scikit-learn==1.6.1" "joblib==1.5.2"

      - name: Export existing model
        run: python tools/export_cloudflare_model.py

      - name: Commit exported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/public/model.json cloudflare/public/knowledge.json cloudflare/public/retriever.json
          if ! git diff --cached --quiet; then
            git commit -m "Export trained model for Cloudflare"
            git push
          fi
